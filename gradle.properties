# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (for better Minecraft parameter names & javadoc)
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21
parchment_mappings_version=2024.11.10

# Environment Properties
# Minecraft + NeoForge must match
minecraft_version=1.21
minecraft_version_range=[1.21]
neo_version=21.0.167
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier (must be lowercase, match your @Mod annotation)
mod_id=invasionri
# The human-readable display name
mod_name=InvasionRI
# The license (adjust if you want a more permissive one, e.g. MIT)
mod_license=All Rights Reserved
# Mod version (semantic versioning recommended)
mod_version=1.2.0
# Group ID (should match your Java package base)
mod_group_id=invmod
# Authors (comma separated)
mod_authors=YourNameHere
# Description (supports \n for newlines)
mod_description=InvasionRI mod for Minecraft 1.21.\nAdds invasion mechanics.

## Dependencies
jade_version=15.1.6+neoforge
